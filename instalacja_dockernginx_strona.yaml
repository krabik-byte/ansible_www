---
- name: Instalacja Docker i strony na Nginx
  hosts: docker.adminakademia.lan
  become: yes
  vars:
    dependency_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-requests
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    keyring_path: /etc/apt/keyrings/docker.asc
  tasks:
    - name: DOCKER - Sprawdz czy docker jest zainstalowany
      command: docker
      register: result
      ignore_errors: yes

    - name: Zainstaluj zaleznosci Dockera
      apt:
        name: "{{ dependency_packages }}"
        state: present
        update_cache: yes
      when: ansible_distribution in ['Debian', 'Ubuntu'] and result.rc != 0

    - name: Przygotuj katalog kluczy APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_distribution in ['Debian', 'Ubuntu'] and result.rc != 0

    - name: Pobierz klucz GPG repozytorium Docker
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: "{{ keyring_path }}"
        mode: "0644"
      when: ansible_distribution in ['Debian', 'Ubuntu'] and result.rc != 0

    - name: Dodaj repozytorium Docker
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by={{ keyring_path }}]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_distribution in ['Debian', 'Ubuntu'] and result.rc != 0

    - name: Zainstaluj Docker i plugin Compose
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      when: ansible_distribution in ['Debian', 'Ubuntu'] and result.rc != 0

    - name: Dodaj opcjonalne dowiazanie docker-compose
      file:
        src: /usr/libexec/docker/cli-plugins/docker-compose
        dest: /usr/local/bin/docker-compose
        state: link
      when: ansible_distribution in ['Debian', 'Ubuntu']

    - name: Sprawdz wersje Docker
      command: docker --version
      register: docker_ver
      changed_when: false

    - name: Sprawdz wersje Docker Compose
      command: docker compose version
      register: compose_ver
      changed_when: false

    - name: Wyswietl wersje Docker
      debug:
        msg: "Docker version: {{ docker_ver.stdout }}"

    - name: Wyswietl wersje Docker Compose
      debug:
        msg: "Docker Compose version: {{ compose_ver.stdout }}"

    - name: Instalacja kontenera NGINX
      community.docker.docker_container:
        name: www-example
        image: nginx
        state: started
        recreate: true
        restart_policy: unless-stopped
        ports:
          - "80:80"
        volumes:
          - "/home/kursant/www-example:/usr/share/nginx/html"

    - name: Kopiowanie katalogu z witryna WWW
      copy:
        src: strona/
        dest: /home/kursant/www-example/
        force: yes
