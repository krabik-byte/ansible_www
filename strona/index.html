<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testowa Strona NGINX</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #333;

    <div class="loga">
      <img alt="Docker"
